<!DOCTYPE html>
<html lang="en" data-theme="dark">

<head>
  <meta charset="UTF-8">
  <meta name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>CampusHub — Your Campus, Simplified</title>
  <meta name="description"
    content="CampusHub helps university students discover campus locations, check crowd levels, read reviews, explore clubs, and join campus events — all in one sleek mobile app.">
  <meta name="theme-color" content="#06080f">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@500;600;700;800&display=swap"
    rel="stylesheet">

  <!-- CSS -->
  <link rel="stylesheet" href="css/variables.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/animations.css">
  <link rel="stylesheet" href="css/academics.css">

  <!-- Leaflet CSS & JS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
    integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
</head>

<body>
  <div id="app">
    <!-- ===== HEADER ===== -->
    <header class="app-header" id="app-header">
      <div class="header-content">
        <div class="logo">
          <span class="logo-icon">🎓</span>
          <span class="logo-text">Campus<span class="accent">Hub</span></span>
        </div>
      </div>
    </header>

    <!-- ===== MAIN CONTENT ===== -->
    <main class="app-main">

      <!-- ===== DASHBOARD PAGE ===== -->
      <section id="dashboard-page" class="page active">
        <div class="page-content" id="dashboard-content"></div>
      </section>

      <!-- ===== EXPLORE PAGE ===== -->
      <section id="explore-page" class="page">
        <div class="page-content">
          <!-- View Toggle & Search -->
          <div class="explore-header-row">
            <div class="search-bar" id="explore-search-bar" style="flex: 1;">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                stroke-linejoin="round">
                <circle cx="11" cy="11" r="8" />
                <path d="M21 21l-4.35-4.35" />
              </svg>
              <input type="text" id="place-search" placeholder="Search campus places..." autocomplete="off">
            </div>
            <div class="view-toggle" id="explore-view-toggle">
              <button class="toggle-btn active" data-view="grid">Grid</button>
              <button class="toggle-btn" data-view="map">Map</button>
            </div>
          </div>

          <!-- Sort Bar -->
          <div class="sort-bar" id="explore-sort-bar">
            <span class="sort-label">Sort by:</span>
            <select id="place-sort" class="sort-select">
              <option value="rating">Rating (High to Low)</option>
              <option value="name">Name (A to Z)</option>
              <option value="crowd">Crowd (Low to High)</option>
            </select>
          </div>

          <!-- Category Chips -->
          <div class="chips-container hide-scrollbar" id="place-categories"></div>

          <!-- Views -->
          <div class="places-grid" id="places-grid"></div>
          <div class="map-container" id="places-map-container" style="display: none;">
            <div id="campus-map"></div>
          </div>
        </div>
      </section>

      <!-- ===== ACADEMICS PAGE ===== -->
      <section id="academics-page" class="page">
        <div class="page-content" id="academics-content"></div>
      </section>

      <!-- ===== CLUBS PAGE ===== -->
      <section id="clubs-page" class="page">
        <div class="page-content">
          <!-- Upcoming Events -->
          <div class="section-header" style="margin-top: var(--space-2);">
            <h2>🔥 Upcoming Events</h2>
          </div>
          <div class="events-scroll hide-scrollbar" id="upcoming-events"></div>
          <!-- Club Categories -->
          <div class="section-header">
            <h2>Clubs & Societies</h2>
          </div>
          <!-- Search -->
          <div class="search-container" style="position:relative; margin-bottom: var(--space-2);">
            <div class="search-bar" id="club-search-bar">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                stroke-linejoin="round">
                <circle cx="11" cy="11" r="8" />
                <path d="M21 21l-4.35-4.35" />
              </svg>
              <input type="text" id="club-search" placeholder="Search clubs..." autocomplete="off">
            </div>
          </div>
          <div class="sort-bar" id="club-sort-bar" style="margin-bottom: var(--space-3);">
            <span class="sort-label">Sort by:</span>
            <select id="club-sort" class="sort-select">
              <option value="members">Members (Most to Least)</option>
              <option value="name">Name (A to Z)</option>
              <option value="events">Events (Most to Least)</option>
            </select>
          </div>
          <div class="chips-container hide-scrollbar" id="club-categories"></div>
          <!-- Clubs Grid -->
          <div class="clubs-grid" id="clubs-grid"></div>
        </div>
      </section>

      <!-- ===== PROFILE PAGE ===== -->
      <section id="profile-page" class="page">
        <div class="page-content" id="profile-content"></div>
      </section>

    </main>

    <!-- ===== BOTTOM NAVIGATION ===== -->
    <nav class="bottom-nav" id="bottom-nav">
      <button class="nav-item active" data-tab="dashboard" id="nav-dashboard">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"
          stroke-linejoin="round">
          <path d="M3 9l9-7 9 7v11a2 2 0 01-2 2H5a2 2 0 01-2-2z" />
          <polyline points="9 22 9 12 15 12 15 22" />
        </svg>
        <span>Home</span>
      </button>
      <button class="nav-item" data-tab="explore" id="nav-explore">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"
          stroke-linejoin="round">
          <circle cx="12" cy="12" r="10" />
          <polygon points="16.24 7.76 14.12 14.12 7.76 16.24 9.88 9.88 16.24 7.76" />
        </svg>
        <span>Explore</span>
      </button>
      <button class="nav-item" data-tab="academics" id="nav-academics">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"
          stroke-linejoin="round">
          <path d="M2 3h6a4 4 0 014 4v14a3 3 0 00-3-3H2z" />
          <path d="M22 3h-6a4 4 0 00-4 4v14a3 3 0 013-3h7z" />
        </svg>
        <span>Academics</span>
      </button>
      <button class="nav-item" data-tab="clubs" id="nav-clubs">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"
          stroke-linejoin="round">
          <rect x="4" y="2" width="16" height="20" rx="2" ry="2" />
          <path d="M9 22v-4h6v4" />
          <path d="M8 6h.01" />
          <path d="M16 6h.01" />
          <path d="M12 6h.01" />
          <path d="M12 10h.01" />
          <path d="M12 14h.01" />
          <path d="M16 10h.01" />
          <path d="M16 14h.01" />
          <path d="M8 10h.01" />
          <path d="M8 14h.01" />
        </svg>
        <span>Clubs</span>
      </button>
      <button class="nav-item" data-tab="profile" id="nav-profile">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"
          stroke-linejoin="round">
          <path d="M20 21v-2a4 4 0 00-4-4H8a4 4 0 00-4 4v2" />
          <circle cx="12" cy="7" r="4" />
        </svg>
        <span>Profile</span>
      </button>
    </nav>

    <!-- ===== PLACE DETAIL MODAL ===== -->
    <div id="place-modal" class="modal">
      <div class="modal-backdrop" onclick="Utils.closeModal('place-modal')"></div>
      <div class="modal-content">
        <div class="modal-scroll" id="place-modal-scroll">
          <!-- Hero -->
          <div class="modal-hero" id="place-modal-hero">
            <div class="modal-hero-gradient" id="place-modal-gradient"></div>
            <div class="modal-header-actions">
              <button class="modal-action-btn" onclick="Utils.closeModal('place-modal')" aria-label="Close">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                  stroke-linejoin="round">
                  <path d="M19 12H5" />
                  <path d="M12 19l-7-7 7-7" />
                </svg>
              </button>
              <button class="modal-action-btn bookmark-btn" id="place-bookmark-btn" aria-label="Bookmark">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                  stroke-linejoin="round">
                  <path d="M19 21l-7-5-7 5V5a2 2 0 012-2h10a2 2 0 012 2z" />
                </svg>
              </button>
            </div>
            <span id="place-modal-icon" style="position:relative;z-index:5;"></span>
          </div>
          <!-- Body -->
          <div class="modal-body" id="place-modal-body"></div>
        </div>
      </div>
    </div>

    <!-- ===== CLUB DETAIL MODAL ===== -->
    <div id="club-modal" class="modal">
      <div class="modal-backdrop" onclick="Utils.closeModal('club-modal')"></div>
      <div class="modal-content">
        <div class="modal-scroll" id="club-modal-scroll">
          <!-- Hero -->
          <div class="modal-hero" id="club-modal-hero">
            <div class="modal-hero-gradient" id="club-modal-gradient"></div>
            <div class="modal-header-actions">
              <button class="modal-action-btn" onclick="Utils.closeModal('club-modal')" aria-label="Close">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                  stroke-linejoin="round">
                  <path d="M19 12H5" />
                  <path d="M12 19l-7-7 7-7" />
                </svg>
              </button>
              <div></div>
            </div>
            <span id="club-modal-icon" style="position:relative;z-index:5;"></span>
          </div>
          <!-- Body -->
          <div class="modal-body" id="club-modal-body"></div>
        </div>
      </div>
    </div>

    <!-- ===== STAFF DETAIL MODAL ===== -->
    <div id="staff-modal" class="modal">
      <div class="modal-backdrop" onclick="Utils.closeModal('staff-modal')"></div>
      <div class="modal-content">
        <div class="modal-scroll" id="staff-modal-scroll">
          <div class="modal-hero" id="staff-modal-hero">
            <div class="modal-hero-gradient" id="staff-modal-gradient"></div>
            <div class="modal-header-actions">
              <button class="modal-action-btn" onclick="Utils.closeModal('staff-modal')" aria-label="Close">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                  stroke-linejoin="round">
                  <path d="M19 12H5" />
                  <path d="M12 19l-7-7 7-7" />
                </svg>
              </button>
              <div></div>
            </div>
            <div class="staff-modal-avatar" id="staff-modal-avatar"></div>
          </div>
          <div class="modal-body" id="staff-modal-body"></div>
        </div>
      </div>
    </div>

  </div>

  <!-- Scripts -->
  <script src="js/data.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/dashboard.js"></script>
  <script src="js/explore.js"></script>
  <script src="js/academics.js"></script>
  <script src="js/staff.js"></script>
  <script src="js/clubs.js"></script>
  <script src="js/profile.js"></script>
  <script src="js/app.js"></script>
</body>

</html>
